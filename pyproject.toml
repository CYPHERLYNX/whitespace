[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitespace-ai"
version = "0.1.0"
description = "Find the whitespace in the AI tool market: trend radar + automated novelty gate for AI-tool builders"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CYPHERLYNX" }]
keywords = ["ai", "developer-tools", "trend-analysis", "novelty", "indie-hacker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
whitespace = "whitespace.cli:main"

[project.urls]
Homepage = "https://github.com/CYPHERLYNX/whitespace"
Issues = "https://github.com/CYPHERLYNX/whitespace/issues"

[tool.setuptools.packages.find]
include = ["whitespace*"]
